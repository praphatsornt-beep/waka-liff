<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAKA — จัดการทัวร์นาเมนต์</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e7e5df; --card-bg: #fff; --card-shadow: 0 24px 60px rgba(40,38,34,.18);
      --card-border: #ddd9d2; --accent: #111740; --text-primary: #1a1a1a; --text-secondary: #666;
      --green: #06c755; --orange: #d97706; --red: #d64545; --label: #a8a8a8;
      --input-bg: #f5f5f5; --field-radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Anuphan','Space Grotesk',sans-serif; background: var(--bg); color: var(--text-primary); font-size: 14px; min-height: 100vh; }
    .wrapper { max-width: 460px; margin: 0 auto; padding: 16px 16px 48px; }
    .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-top: 8px; }
    .top-bar h1 { font-size: 18px; font-weight: 700; flex: 1; }
    .back-link { font-size: 13px; color: var(--text-secondary); text-decoration: none; }
    .card { background: var(--card-bg); border-radius: 14px; box-shadow: var(--card-shadow); border: 1px solid var(--card-border); padding: 20px; margin-bottom: 14px; }
    .section-label { font-family: 'Space Grotesk',sans-serif; font-size: 11px; font-weight: 600; color: var(--label); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
    .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    .optional { font-size: 10px; color: var(--label); font-weight: 400; }
    input[type="text"], input[type="date"], input[type="number"], textarea, select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--card-border);
      border-radius: var(--field-radius); background: var(--input-bg);
      font-size: 14px; font-family: inherit; margin-bottom: 12px;
    }
    textarea { resize: none; height: 80px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: var(--field-radius); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .ev-card { background: var(--input-bg); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .ev-card .ev-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .ev-card .ev-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .ev-card .ev-link { font-family: 'Space Grotesk',sans-serif; font-size: 11px; color: var(--accent); word-break: break-all; background: #fff; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--card-border); display: block; margin-bottom: 8px; }
    .ev-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .ev-actions button { padding: 6px 14px; border-radius: 8px; border: 1.5px solid; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; background: transparent; }
    .btn-copy { border-color: var(--accent); color: var(--accent); }
    .btn-open { border-color: var(--green); color: var(--green); }
    .btn-close { border-color: var(--orange); color: var(--orange); }

    .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .status-badge.open { background: #f0fbf4; color: var(--green); border: 1px solid #a5d6a7; }
    .status-badge.closed { background: #fff8e1; color: var(--orange); border: 1px solid #ffe082; }
    .status-badge.draft { background: #f5f5f5; color: #666; border: 1px solid #ddd; }
    .status-badge.completed { background: #f0f0fa; color: #444; border: 1px solid #c5c5e0; }

    .copy-success { display: none; font-size: 11px; color: var(--green); padding: 2px 6px; }
    #newEvForm { display: none; }
    .toggle-form-btn { width: 100%; padding: 12px; background: transparent; color: var(--accent); border: 1.5px dashed var(--card-border); border-radius: var(--field-radius); font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; margin-bottom: 14px; }
    .toggle-form-btn:hover { border-color: var(--accent); }
    #evList .empty { text-align: center; padding: 32px; color: var(--text-secondary); font-size: 13px; }
    .loading-inline { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }
    .cats-toggle { padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--accent); color: var(--accent); font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; background: transparent; }
    .cats-panel { display: none; border-top: 1px solid var(--card-border); margin-top: 10px; padding-top: 10px; }
    .cat-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .cat-row .cat-nm { flex: 1; font-weight: 500; }
    .cat-row .cat-pr { font-family: 'Space Grotesk',sans-serif; font-weight: 700; color: var(--accent); min-width: 60px; text-align: right; }
    .cat-row .cat-del { padding: 3px 10px; border: 1.5px solid var(--red); color: var(--red); border-radius: 6px; font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer; background: transparent; }
    .cat-add-row { display: flex; gap: 6px; margin-top: 8px; }
    .cat-add-row input { margin: 0; padding: 8px 10px; font-size: 13px; flex: 1; }
    .cat-add-row input.fee-input { width: 90px; flex: none; }
    .cat-add-btn { padding: 8px 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; }

    .new-cat-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .new-cat-row input[type="text"],
    .new-cat-row input[type="number"] { margin: 0; padding: 10px 12px; font-size: 13px; }
    .new-cat-row input[type="text"] { flex: 1; }
    .new-cat-row input[type="number"] { width: 90px; flex: none; }
    .rm-cat-btn { padding: 8px 10px; border: 1.5px solid var(--red); color: var(--red); background: transparent; border-radius: 8px; font-size: 13px; cursor: pointer; flex-shrink: 0; }
    .add-cat-form-btn { width: 100%; padding: 10px; background: transparent; color: var(--accent); border: 1.5px dashed var(--card-border); border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; margin-bottom: 12px; }
    .add-cat-form-btn:hover { border-color: var(--accent); }
    .form-divider { height: 1px; background: var(--card-border); margin: 4px 0 16px; }
    .edit-panel { display: none; border-top: 1px solid var(--card-border); margin-top: 10px; padding-top: 12px; }
    .edit-panel input[type="text"], .edit-panel input[type="date"], .edit-panel input[type="number"], .edit-panel textarea { margin-bottom: 8px; }
    .edit-panel textarea { height: 70px; }
    .edit-panel-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn-save-edit { flex: 1; padding: 8px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .btn-save-edit:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel-edit { padding: 8px 14px; border: 1.5px solid var(--card-border); color: var(--text-secondary); border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; background: transparent; }
    .btn-edit { border-color: #888; color: #555; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="top-bar">
    <a class="back-link" href="menu.html">← เมนู</a>
    <h1>🏆 จัดการทัวร์</h1>
  </div>

  <!-- Create form toggle -->
  <button class="toggle-form-btn" onclick="toggleForm()">+ สร้างทัวร์นาเมนต์ใหม่</button>

  <div class="card" id="newEvForm">
    <div class="section-label">ข้อมูลทัวร์นาเมนต์</div>
    <label class="field-label">ชื่องาน <span style="color:#d64545">*</span></label>
    <input type="text" id="evName" placeholder="เช่น WAKA Summer Cup 2026" />
    <label class="field-label">วันจัดงาน <span style="color:#d64545">*</span></label>
    <input type="date" id="evDate" />
    <label class="field-label">จำนวนผู้สมัครสูงสุด <span class="optional">(0 = ไม่จำกัด)</span></label>
    <input type="number" id="evMax" placeholder="0" min="0" />
    <label class="field-label">วันปิดรับสมัคร <span class="optional">(ไม่บังคับ)</span></label>
    <input type="date" id="evClose" />
    <label class="field-label">กติกา / รายละเอียด <span class="optional">(แสดงในฟอร์มลูกค้า)</span></label>
    <textarea id="evRules" placeholder="รายละเอียดการแข่งขัน กติกา รางวัล ฯลฯ"></textarea>

    <div class="form-divider"></div>
    <div class="section-label">ประเภทการแข่งขัน <span class="optional" style="text-transform:none;letter-spacing:0">(เพิ่มได้หลายประเภท ต่างราคา)</span></div>
    <div id="newCatRows"></div>
    <button type="button" class="add-cat-form-btn" onclick="addNewCatRow()">+ เพิ่มประเภท</button>

    <div id="evFeeWrap">
      <label class="field-label">ค่าสมัคร (บาท) <span class="optional">(ใช้เมื่อไม่มีประเภท)</span></label>
      <input type="number" id="evFee" placeholder="0" min="0" />
    </div>

    <button class="btn-primary" id="createBtn" onclick="submitCreateEvent()">สร้างทัวร์นาเมนต์</button>
    <div id="createResult" style="margin-top:14px;display:none">
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">ลิงค์ลงทะเบียน:</div>
      <div id="newEvLink" class="ev-link" style="background:var(--input-bg);border-radius:8px;padding:10px;word-break:break-all;font-size:12px;color:var(--accent);border:1px solid var(--card-border)"></div>
      <button class="btn-primary" style="margin-top:8px" onclick="copyNewLink()">📋 คัดลอกลิงค์</button>
      <div id="copiedNew" class="copy-success" style="text-align:center;margin-top:6px">✅ คัดลอกแล้ว!</div>
    </div>
  </div>

  <!-- Event list -->
  <div class="card">
    <div class="section-label">ทัวร์นาเมนต์ทั้งหมด</div>
    <div id="evList" class="loading-inline">กำลังโหลด...</div>
  </div>
</div>

<script>
const WAKA_S = "SEpVTmIUFwEUgvVflPPIuv1gDhhiqSKRVjjGG34z";
const G = "https://script.google.com/macros/s/AKfycbz52wvADM7O1zMjqKlT2G4HPkq8gwAon_fUCuKgbmUMkDPQkaYKUWnv598U3EkFN1AByQ/exec?_s=" + WAKA_S;
let formOpen = false;
var _catUid = 0;
var _catIds = [];

function addNewCatRow() {
  var uid = _catUid++;
  _catIds.push(uid);
  var container = document.getElementById("newCatRows");
  var row = document.createElement("div");
  row.className = "new-cat-row";
  row.id = "ncRow_" + uid;
  row.innerHTML = '<input type="text" placeholder="ชื่อประเภท เช่น Standard" id="ncName_' + uid + '" />'
    + '<input type="number" placeholder="ราคา" id="ncFee_' + uid + '" min="0" />'
    + '<button type="button" class="rm-cat-btn" onclick="removeNewCatRow(' + uid + ')">✕</button>';
  container.appendChild(row);
  updateFeeVisibility();
}

function removeNewCatRow(uid) {
  var row = document.getElementById("ncRow_" + uid);
  if (row) row.remove();
  _catIds = _catIds.filter(function(id) { return id !== uid; });
  updateFeeVisibility();
}

function updateFeeVisibility() {
  var wrap = document.getElementById("evFeeWrap");
  if (wrap) wrap.style.display = _catIds.length > 0 ? "none" : "block";
}

function resetNewCatForm() {
  _catIds = [];
  _catUid = 0;
  document.getElementById("newCatRows").innerHTML = "";
  updateFeeVisibility();
}

function toggleForm() {
  formOpen = !formOpen;
  document.getElementById("newEvForm").style.display = formOpen ? "block" : "none";
  document.querySelector(".toggle-form-btn").textContent = formOpen ? "✕ ยกเลิก" : "+ สร้างทัวร์นาเมนต์ใหม่";
}

async function loadEvents() {
  var el = document.getElementById("evList");
  el.innerHTML = '<div class="loading-inline">กำลังโหลด...</div>';
  var slowTimer = setTimeout(function() {
    if (el.querySelector('.loading-inline')) el.innerHTML = '<div class="loading-inline">GAS กำลัง warmup... รอสักครู่ 🔄</div>';
  }, 10000);
  try {
    var res = await fetch(G + "&action=api&do=tournament_events&_t=" + Date.now());
    clearTimeout(slowTimer);
    var d = await res.json();
    renderEvents(d.events || []);
  } catch(e) {
    clearTimeout(slowTimer);
    el.innerHTML = '<div class="empty">โหลดไม่ได้: ' + esc(e.message) + '<br><br><button onclick="loadEvents()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer">🔄 ลองใหม่</button></div>';
  }
}

function renderEvents(events) {
  var el = document.getElementById("evList");
  if (!events.length) { el.innerHTML = '<div class="empty">ยังไม่มีทัวร์นาเมนต์</div>'; return; }
  _eventsMap = {};
  for (var mi = 0; mi < events.length; mi++) { _eventsMap[events[mi].event_id] = events[mi]; }
  var html = "";
  for (var i = 0; i < events.length; i++) {
    var ev = events[i];
    var link = "https://liff.line.me/2010457385-JHbMDl5I?event=" + ev.event_id;
    var stClass = { open: "open", closed: "closed", draft: "draft", completed: "completed" }[ev.status] || "draft";
    var stLabel = { open: "🟢 เปิดรับสมัคร", closed: "🟡 ปิดรับสมัคร", draft: "⚫ Draft", completed: "✅ จบแล้ว" }[ev.status] || ev.status;
    html += '<div class="ev-card">';
    html += '<div class="ev-name">' + esc(ev.name) + '</div>';
    html += '<div class="ev-meta">📅 ' + esc(ev.date || "—") + (ev.entry_fee ? " · 💰 " + Number(ev.entry_fee).toLocaleString() + " บาท" : "") + (ev.max_players ? " · 👤 max " + ev.max_players : "") + '</div>';
    html += '<span class="status-badge ' + stClass + '">' + stLabel + '</span>';
    html += '<div style="margin-top:10px">';
    html += '<div class="ev-link" id="link_' + i + '">' + link + '</div>';
    html += '</div>';
    html += '<div class="ev-actions">';
    html += '<button class="btn-copy" onclick="copyLink(' + i + ',\'' + encodeURIComponent(link) + '\')">📋 คัดลอกลิงค์</button>';
    html += '<span class="copy-success" id="cs_' + i + '">✅ คัดลอกแล้ว!</span>';
    if (ev.status !== "open") html += '<button class="btn-open" onclick="updateStatus(\'' + esc(ev.event_id) + '\',\'open\')">เปิดรับสมัคร</button>';
    if (ev.status === "open") html += '<button class="btn-close" onclick="updateStatus(\'' + esc(ev.event_id) + '\',\'closed\')">ปิดรับสมัคร</button>';
    if (ev.status !== "completed") html += '<button style="border-color:#999;color:#999" onclick="updateStatus(\'' + esc(ev.event_id) + '\',\'completed\')">จบแล้ว</button>';
    html += '<button class="cats-toggle" onclick="toggleCats(\'' + esc(ev.event_id) + '\')">📋 หมวด</button>';
    html += '<button class="btn-edit" onclick="toggleEdit(\'' + esc(ev.event_id) + '\')">✏️ แก้ไข</button>';
    html += '</div>';
    html += '<div class="cats-panel" id="catsPanel_' + esc(ev.event_id) + '">';
    html += '<div style="font-size:11px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">รายการแข่งขัน</div>';
    html += '<div id="catList_' + esc(ev.event_id) + '"><span style="font-size:12px;color:var(--text-secondary)">กดเพื่อโหลด</span></div>';
    html += '<div class="cat-add-row">';
    html += '<input type="text" placeholder="ชื่อรายการ" id="catName_' + esc(ev.event_id) + '" />';
    html += '<input type="number" placeholder="ค่าสมัคร" class="fee-input" id="catFee_' + esc(ev.event_id) + '" min="0" />';
    html += '<button class="cat-add-btn" onclick="addCat(\'' + esc(ev.event_id) + '\')">+ เพิ่ม</button>';
    html += '</div></div>';
    html += '<div class="edit-panel" id="editPanel_' + esc(ev.event_id) + '">';
    html += '<div style="font-size:11px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">แก้ไขข้อมูล</div>';
    html += '<label class="field-label">ชื่องาน</label>';
    html += '<input type="text" id="eName_' + esc(ev.event_id) + '" />';
    html += '<label class="field-label">วันจัดงาน</label>';
    html += '<input type="date" id="eDate_' + esc(ev.event_id) + '" />';
    html += '<label class="field-label">จำนวนสูงสุด <span class="optional">(0 = ไม่จำกัด)</span></label>';
    html += '<input type="number" id="eMax_' + esc(ev.event_id) + '" min="0" />';
    html += '<label class="field-label">วันปิดรับสมัคร <span class="optional">(ไม่บังคับ)</span></label>';
    html += '<input type="date" id="eClose_' + esc(ev.event_id) + '" />';
    html += '<label class="field-label">ค่าสมัคร <span class="optional">(บาท — ใช้เมื่อไม่มีประเภท)</span></label>';
    html += '<input type="number" id="eFee_' + esc(ev.event_id) + '" min="0" />';
    html += '<label class="field-label">กติกา / รายละเอียด</label>';
    html += '<textarea id="eRules_' + esc(ev.event_id) + '"></textarea>';
    html += '<div class="edit-panel-actions">';
    html += '<button class="btn-save-edit" id="eSaveBtn_' + esc(ev.event_id) + '" onclick="saveEdit(\'' + esc(ev.event_id) + '\')">💾 บันทึก</button>';
    html += '<button class="btn-cancel-edit" onclick="toggleEdit(\'' + esc(ev.event_id) + '\')">ยกเลิก</button>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function copyLink(idx, encodedLink) {
  navigator.clipboard.writeText(decodeURIComponent(encodedLink)).then(function() {
    var cs = document.getElementById("cs_" + idx);
    if (cs) { cs.style.display = "inline"; setTimeout(function() { cs.style.display = "none"; }, 2000); }
  });
}

async function updateStatus(evId, status) {
  var labels = { open: "เปิดรับสมัคร", closed: "ปิดรับสมัคร", completed: "จบแล้ว" };
  if (!confirm('เปลี่ยนสถานะเป็น "' + (labels[status] || status) + '" ?')) return;
  try {
    var res = await fetch(G + "&action=api&do=tournament_update_event&event=" + encodeURIComponent(evId) + "&status=" + encodeURIComponent(status));
    var d = await res.json();
    if (d.ok) loadEvents();
    else alert(d.error || "เกิดข้อผิดพลาด");
  } catch(e) { alert("เกิดข้อผิดพลาด: " + e.message); }
}

async function submitCreateEvent() {
  var name = document.getElementById("evName").value.trim();
  var date = document.getElementById("evDate").value.trim();
  if (!name) { alert("กรุณากรอกชื่องาน"); return; }
  if (!date) { alert("กรุณาเลือกวันจัดงาน"); return; }

  var cats = _catIds.map(function(uid) {
    return {
      name: (document.getElementById("ncName_" + uid) || {value:""}).value.trim(),
      fee:  Number((document.getElementById("ncFee_"  + uid) || {value:"0"}).value) || 0
    };
  }).filter(function(c) { return c.name; });

  var btn = document.getElementById("createBtn");
  btn.disabled = true;
  btn.textContent = "⏳ กำลังสร้าง... (รอ GAS)";
  var slowTimer2 = setTimeout(function() { if (btn.disabled) btn.textContent = "⏳ GAS กำลัง warmup... รอสักครู่"; }, 10000);
  try {
    var entryFee = cats.length > 0 ? 0 : (document.getElementById("evFee").value || "0");
    var url = G + "&action=api&do=tournament_create_event"
      + "&name=" + encodeURIComponent(name)
      + "&date=" + encodeURIComponent(date)
      + "&entry_fee=" + encodeURIComponent(entryFee)
      + "&max_players=" + encodeURIComponent(document.getElementById("evMax").value || "0")
      + "&registration_close=" + encodeURIComponent(document.getElementById("evClose").value || "")
      + "&rules_text=" + encodeURIComponent(document.getElementById("evRules").value || "");
    var res = await fetch(url);
    clearTimeout(slowTimer2);
    var d = await res.json();
    if (!d.ok) { alert(d.error || "เกิดข้อผิดพลาด"); btn.disabled = false; btn.textContent = "สร้างทัวร์นาเมนต์"; return; }

    for (var ci = 0; ci < cats.length; ci++) {
      btn.textContent = "⏳ เพิ่มประเภท " + (ci + 1) + "/" + cats.length + "...";
      await fetch(G + "&action=api&do=tournament_add_category"
        + "&event=" + encodeURIComponent(d.event_id)
        + "&name=" + encodeURIComponent(cats[ci].name)
        + "&fee=" + cats[ci].fee);
    }

    document.getElementById("newEvLink").textContent = d.reg_link;
    document.getElementById("newEvLink").dataset.link = d.reg_link;
    document.getElementById("createResult").style.display = "block";
    resetNewCatForm();
    loadEvents();
  } catch(e) {
    clearTimeout(slowTimer2);
    alert("เกิดข้อผิดพลาด: " + e.message);
  }
  btn.disabled = false; btn.textContent = "สร้างทัวร์นาเมนต์";
}

function copyNewLink() {
  var link = document.getElementById("newEvLink").dataset.link || document.getElementById("newEvLink").textContent;
  navigator.clipboard.writeText(link).then(function() {
    var el = document.getElementById("copiedNew");
    el.style.display = "block"; setTimeout(function() { el.style.display = "none"; }, 2000);
  });
}

function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

var catsLoaded = {};
var _eventsMap = {};

function toggleEdit(evId) {
  var panel = document.getElementById("editPanel_" + evId);
  if (!panel) return;
  var isOpen = panel.style.display === "block";
  if (!isOpen) {
    var ev = _eventsMap[evId];
    if (ev) {
      var setVal = function(id, val) { var el = document.getElementById(id); if (el) el.value = (val != null ? val : ""); };
      setVal("eName_" + evId, ev.name);
      setVal("eDate_" + evId, ev.date);
      setVal("eMax_" + evId, ev.max_players || "0");
      setVal("eClose_" + evId, ev.registration_close || "");
      setVal("eFee_" + evId, ev.entry_fee || "0");
      setVal("eRules_" + evId, ev.rules_text || "");
    }
  }
  panel.style.display = isOpen ? "none" : "block";
}

async function saveEdit(evId) {
  var getVal = function(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
  var name = getVal("eName_" + evId);
  var date = getVal("eDate_" + evId);
  if (!name) { alert("กรุณากรอกชื่องาน"); return; }
  if (!date) { alert("กรุณาเลือกวันจัดงาน"); return; }
  var saveBtn = document.getElementById("eSaveBtn_" + evId);
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "⏳ กำลังบันทึก..."; }
  try {
    var res = await fetch(G + "&action=api&do=tournament_update_event"
      + "&event=" + encodeURIComponent(evId)
      + "&name=" + encodeURIComponent(name)
      + "&date=" + encodeURIComponent(date)
      + "&max_players=" + encodeURIComponent(getVal("eMax_" + evId) || "0")
      + "&registration_close=" + encodeURIComponent(getVal("eClose_" + evId))
      + "&entry_fee=" + encodeURIComponent(getVal("eFee_" + evId) || "0")
      + "&rules_text=" + encodeURIComponent(getVal("eRules_" + evId)));
    var d = await res.json();
    if (d.ok) {
      toggleEdit(evId);
      loadEvents();
    } else {
      alert(d.error || "เกิดข้อผิดพลาด");
    }
  } catch(e) {
    alert("เกิดข้อผิดพลาด: " + e.message);
  }
  if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "💾 บันทึก"; }
}

function toggleCats(evId) {
  var panel = document.getElementById("catsPanel_" + evId);
  if (!panel) return;
  var isOpen = panel.style.display === "block";
  panel.style.display = isOpen ? "none" : "block";
  if (!isOpen && !catsLoaded[evId]) loadCats(evId);
}

async function loadCats(evId) {
  var listEl = document.getElementById("catList_" + evId);
  if (!listEl) return;
  listEl.innerHTML = '<span style="font-size:12px;color:var(--text-secondary)">กำลังโหลด...</span>';
  try {
    var res = await fetch(G + "&action=api&do=tournament_categories&event=" + encodeURIComponent(evId) + "&_t=" + Date.now());
    var d = await res.json();
    catsLoaded[evId] = true;
    renderCatList(evId, d.categories || []);
  } catch(e) {
    listEl.innerHTML = '<span style="font-size:12px;color:var(--red)">โหลดไม่ได้</span>';
  }
}

function renderCatList(evId, cats) {
  var listEl = document.getElementById("catList_" + evId);
  if (!listEl) return;
  if (!cats.length) { listEl.innerHTML = '<span style="font-size:12px;color:var(--text-secondary)">ยังไม่มีรายการ</span>'; return; }
  var html = "";
  cats.forEach(function(c) {
    html += '<div class="cat-row">';
    html += '<span class="cat-nm">' + esc(c.name) + '</span>';
    html += '<span class="cat-pr">฿' + Number(c.entry_fee).toLocaleString() + '</span>';
    html += '<button class="cat-del" onclick="deleteCat(\'' + esc(c.category_id) + '\',\'' + esc(evId) + '\')">ลบ</button>';
    html += '</div>';
  });
  listEl.innerHTML = html;
}

async function addCat(evId) {
  var nameEl = document.getElementById("catName_" + evId);
  var feeEl = document.getElementById("catFee_" + evId);
  var name = nameEl ? nameEl.value.trim() : "";
  var fee = feeEl ? Number(feeEl.value) || 0 : 0;
  if (!name) { alert("กรุณากรอกชื่อรายการ"); return; }
  try {
    var url = G + "&action=api&do=tournament_add_category"
      + "&event=" + encodeURIComponent(evId)
      + "&name=" + encodeURIComponent(name)
      + "&fee=" + fee;
    var res = await fetch(url);
    var d = await res.json();
    if (d.ok) {
      if (nameEl) nameEl.value = "";
      if (feeEl) feeEl.value = "";
      catsLoaded[evId] = false;
      loadCats(evId);
    } else {
      alert(d.error || "เกิดข้อผิดพลาด");
    }
  } catch(e) { alert("เกิดข้อผิดพลาด: " + e.message); }
}

async function deleteCat(catId, evId) {
  if (!confirm("ลบรายการนี้?")) return;
  try {
    var url = G + "&action=api&do=tournament_delete_category&category_id=" + encodeURIComponent(catId);
    var res = await fetch(url);
    var d = await res.json();
    if (d.ok) { catsLoaded[evId] = false; loadCats(evId); }
    else alert(d.error || "เกิดข้อผิดพลาด");
  } catch(e) { alert("เกิดข้อผิดพลาด: " + e.message); }
}

loadEvents();
</script>
</body>
</html>
